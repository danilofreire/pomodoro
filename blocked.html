<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <title>Blocked during focus</title>
  <style>
    :root { color-scheme: light dark; --bg: #fbf8f5; --text: #2a2623; --muted: #857c75; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1d1b1a; --text: #f3eeea; --muted: #a39a93; }
    }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    img { width: 72px; height: 72px; }
    h1 { margin: 16px 0 4px; font-size: 24px; }
    p { margin: 0; color: var(--muted); }
    #time {
      margin: 20px 0 4px;
      color: #d9453a;
      font-size: 64px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon128.png" alt="">
    <h1>Back to your focus session</h1>
    <p><span id="host">This site</span> is blocked until the session ends</p>
    <div id="time"></div>
    <p id="hint">The page will reopen by itself</p>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
